---
# Target: a fresh Debian 13 VPS reachable via SSH.
# Replace 203.0.113.10 with your VPS IP and adjust ansible_user (root, debian, etc.)
#
# Tip: run `ssh-copy-id root@203.0.113.10` first so Ansible can connect with
# key-only auth. If your provider only gives you a password, set
# ansible_ssh_password and ansible_become_password in group_vars/all.yml
# (use ansible-vault encrypt group_vars/all.yml to protect them).

all:
  hosts:
    matrix-vps:
      ansible_host: 45.76.233.171
      ansible_user: linuxuser
      # ansible_ssh_private_key_file: ~/.ssh/id_ed25519