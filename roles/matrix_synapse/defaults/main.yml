---
# Default variables for matrix-synapse role

matrix_domain: matrix.didyoushitmypants.com
matrix_server_name: didyoushitmypants.com
matrix_admin_user: "@admin:didyoushitmypants.com"

# ── Database ─────────────────────────────────────────────────────────────
matrix_db_name: synapse
matrix_db_user: synapse
matrix_db_password: "CHANGE_ME"

# ── Synapse config ────────────────────────────────────────────────────────
matrix_data_dir: /var/lib/matrix-synapse
matrix_config_dir: /etc/matrix-synapse
matrix_signing_key_path: "/etc/matrix-synapse/{{ matrix_domain }}.signing.key"
max_upload_size: "50M"
max_image_pixels: "32M"

# ── Ports ─────────────────────────────────────────────────────────────────
synapse_http_port: 8008        # Internal HTTP listener (nginx proxies to this)
synapse_replication_port: 9090 # Worker replication (optional, unused for small installs)
synapse_manhole_enabled: false

# ── Federation ────────────────────────────────────────────────────────────
federation_domain_whitelist: []  # Empty = open federation

# ── Registration ──────────────────────────────────────────────────────────
enable_registration: false
registration_shared_secret: ""  # CHANGE — generate a long random hex string

# ── Message retention ────────────────────────────────────────────────────
message_retention_enabled: false
message_retention_max_lifetime: "1y"

# ── Bot users for Matrix ────────────────────────────────────────────────
matrix_bot_users:
  - name: "elliot"
    full_name: "Elliot Alderson"
    admin: false
  - name: "grace-hopper"
    full_name: "Grace Hopper"
    admin: false
  - name: "hermes"
    full_name: "Hermes"
    admin: false
  - name: "richard-feynman"
    full_name: "Richard Feynman"
    admin: false
  - name: "william-shakespeare"
    full_name: "William Shakespeare"
    admin: false
  - name: "plutonium1581"
    full_name: "Plutonium1581"
    admin: false

# Bot passwords — vault-override these in group_vars/all.yml
matrix_bot_passwords:
  elliot: "CHANGE_ME_vault_elliot"
  grace-hopper: "CHANGE_ME_vault_grace_hopper"
  hermes: "CHANGE_ME_vault_hermes"
  richard-feynman: "CHANGE_ME_vault_richard_feynman"
  william-shakespeare: "CHANGE_ME_vault_william_shakespeare"
  plutonium1581: "CHANGE_ME_vault_plutonium1581"
# Debian 13 ships synapse; pin to keep updates predictable
synapse_pkg_name: matrix-synapse
