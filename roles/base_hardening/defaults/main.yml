deployer_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPLACEHOLDER liam@workstation"
timezone: "America/Chicago"
allowed_ssh_networks:
  - "0.0.0.0/0"

# Packages to install for baseline security + utility
baseline_packages:
