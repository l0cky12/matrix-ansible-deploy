  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - curl
  - wget
  - gnupg
  - lsb-release
  - ca-certificates
  - python3
  - python3-pip
  - python3-venv
  - rsync
  - sudo
  - openssh-server
  - htop
  - vim
  - git
  - chrony
  - util-linux
