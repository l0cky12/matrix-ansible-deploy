---
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart ufw
  ansible.builtin.service:
    name: ufw
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart cron
  ansible.builtin.service:
    name: cron
    state: restarted
